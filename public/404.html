<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MOTIBILIS - Redirecting...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Converts direct path requests (e.g. /Motibilis/home) to hash routes (e.g. /Motibilis/#/home)
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const repoName = 'Motibilis';
      const repoIndex = pathSegments.indexOf(repoName);
      let subPath = '';
      if (repoIndex !== -1) {
        subPath = pathSegments.slice(repoIndex + 1).join('/');
      } else {
        subPath = pathSegments.join('/');
      }
      const targetUrl = window.location.origin + '/' + repoName + '/#' + (subPath ? '/' + subPath : '') + window.location.search + window.location.hash;
      window.location.replace(targetUrl);
    </script>
  </head>
  <body style="background-color: #000000; color: #D4AF37; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to Motibilis Showcase...</p>
  </body>
</html>
